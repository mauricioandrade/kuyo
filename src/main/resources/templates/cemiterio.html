<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuyō · {repo}</title>
<style>
  :root { color-scheme: dark; --ceu: #0d0b18; --pedra: #3f3b55; --texto: #e9e4ff; --suave: #a9a3c4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ceu); color: var(--texto); font: 16px/1.5 Georgia, serif; }
  header { text-align: center; padding: 48px 16px 24px; }
  header h1 { margin: 0; font-size: 2.6rem; font-weight: normal; }
  header p { margin: 4px 0 0; color: var(--suave); font-style: italic; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 24px 16px 64px; max-width: 1200px; margin: 0 auto; }
  .tumulo { background: var(--pedra); border-radius: 120px 120px 8px 8px; padding: 56px 20px 24px; text-align: center; }
  .tumulo h2 { margin: 0; font-size: 1.1rem; word-break: break-all; }
  .datas, .causa { color: var(--suave); font-size: .85rem; margin: 4px 0; }
  .epitafio { font-style: italic; margin: 16px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Kuyō 供養</h1>
  <p>{almas.size} souls laid to rest from {repo}</p>
</header>
<main>
{#for t in almas}
  <article class="tumulo" data-chamas="{t.chamas}">
    <h2 title="{t.caminho}">{t.nome}</h2>
    <p class="datas">{t.nascimento} – {t.morte}</p>
    <p class="causa">{t.causa} · {t.inquietacaoFormatada}</p>
    {#if t.epitafio}<p class="epitafio">{t.epitafio}</p>{/if}
  </article>
{/for}
</main>
</body>
</html>
