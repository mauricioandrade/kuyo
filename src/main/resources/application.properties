quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."dev.kuyo".level=INFO
# LangChain4j's retry logs a stack trace at WARN; BuryCommand already explains the failure
quarkus.log.category."dev.langchain4j".level=ERROR

# the model is built in MonkModel from the config below, read at runtime
kuyo.ollama.url=${KUYO_OLLAMA_URL:http://localhost:11434}
kuyo.model=${KUYO_MODEL:gemma4:e4b}
kuyo.temperature=0.7

# the extension only provides the HTTP client; no dev services starting a container
quarkus.langchain4j.ollama.devservices.enabled=false

# the autopsy (bury --autopsy) calls the Shishō: a command on the PATH or the path of a shisho.jar
kuyo.shisho=${KUYO_SHISHO:shisho}
