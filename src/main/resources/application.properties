quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."dev.kuyo".level=INFO
# o retry do LangChain4j loga stack trace em WARN; o BuryCommand já explica a falha
quarkus.log.category."dev.langchain4j".level=ERROR

# o modelo é montado em ModeloDoMonge com a config abaixo, lida em tempo de execução
kuyo.ollama.url=${KUYO_OLLAMA_URL:http://localhost:11434}
kuyo.modelo=${KUYO_MODELO:gemma4:e4b}
kuyo.temperatura=0.7

# a extensão só fornece o cliente HTTP; nada de dev services subindo container
quarkus.langchain4j.ollama.devservices.enabled=false

# a autópsia (bury --autopsia) chama o Shishō: um comando no PATH ou o caminho de um shisho.jar
kuyo.shisho=${KUYO_SHISHO:shisho}
